apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: springboot-green-hpa
  namespace: application

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: springboot-green

  minReplicas: 3
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70