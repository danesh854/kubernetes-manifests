apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot-green
  namespace: application

spec:
  replicas: 3

  selector:
    matchLabels:
      app: springboot
      version: green

  template:
    metadata:
      labels:
        app: springboot
        version: green

    spec:
      containers:
      - name: springboot-container
        image: daneshkabade45/springboot-enterprise-app:7
        
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"