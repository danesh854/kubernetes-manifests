apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot-blue
  namespace: application

spec:
  replicas: 3

  selector:
    matchLabels:
      app: springboot
      version: blue

  template:

    metadata:
      labels:
        app: springboot
        version: blue

    spec:
      containers:

      - name: springboot-container
        image: daneshkabade45/springboot-enterprise-app:5

        ports:
        - containerPort: 8080